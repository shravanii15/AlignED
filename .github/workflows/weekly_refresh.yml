name: Weekly Market Refresh

# Every Monday: compare the postings collected by Daily Ingestion with the fixed
# historical sample and publish data/market_pulse/latest.json. The dashboard shows
# it with a "last updated" date.
#
# - Input: the committed raw snapshots in data/raw/adzuna/ and the committed database.
# - Output: one small JSON file (a few KB), committed. No binary database is committed.
# - Gap scores, recommendations and trends are NOT changed by this job.
# - If there are too few recent postings the script exits 1 and the run fails
#   (GitHub emails the repository owner); the previous file stays in place.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install scipy pandas

      - name: Recompute the market pulse
        run: python scripts/market_pulse.py

      - name: Commit the refreshed file
        run: |
          git config user.name "AlignED Bot"
          git config user.email "actions@github.com"
          git add data/market_pulse/latest.json
          git commit -m "Weekly market pulse refresh" || echo "No change"
          git pull --rebase origin main
          git push
