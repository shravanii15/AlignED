name: Daily Ingestion

# Every day: pull postings from Adzuna, validate and de-duplicate them, load
# them into SQLite, and keep the untouched raw response as a dated snapshot.
#
# - The raw snapshot (data/raw/adzuna/YYYY-MM-DD.json) is committed. It is the
#   immutable raw layer: the database can be rebuilt from these files.
# - The loaded database is uploaded as a workflow artifact, not committed
#   (a 9 MB binary every day would bloat the repository).
# - If the API is unreachable (exit 2) or more than 30% of postings fail
#   validation (exit 3) the run fails, and GitHub emails the repository owner.
#   That is the alert.
# - Loaded Adzuna postings never change a dashboard number: gap scores and
#   trends use only the Kaggle historical sample.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install requests

      - name: Ingest postings (fetch, validate, deduplicate, load)
        id: ingest
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          set +e
          python scripts/ingest_adzuna.py | tee ingest_report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Keep the loaded database and report for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-${{ github.run_id }}
          path: |
            database/aligned.db
            ingest_report.txt
          retention-days: 14

      - name: Commit the raw snapshot
        run: |
          # The loaded database was saved as an artifact above. Discard the local
          # change so the working tree is clean: `git pull --rebase` refuses to run
          # with uncommitted changes (that was the cause of exit code 128).
          git checkout -- database/aligned.db
          git config user.name "AlignED Bot"
          git config user.email "actions@github.com"
          git add data/raw/adzuna/
          git commit -m "Daily raw Adzuna snapshot" || echo "No new snapshot"
          git pull --rebase origin main
          git push

      - name: Fail the run if ingestion failed or data quality degraded
        if: steps.ingest.outputs.exit_code != '0'
        run: |
          echo "Ingestion exited with code ${{ steps.ingest.outputs.exit_code }} (2 = fetch failed, 3 = data quality degraded)"
          exit 1
