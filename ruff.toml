# Lint rules: real bugs only (syntax errors, undefined names, unused imports
# and variables, mutable default arguments). Style-only rules are left off so
# the check stays meaningful instead of noisy.
line-length = 140
target-version = "py310"
extend-exclude = ["Research", "Project Documentation", "data"]

[lint]
select = ["E9", "F", "B006", "B008"]
ignore = ["F401"]   # re-exports and import-for-side-effect are used on purpose in a few modules

[lint.per-file-ignores]
# FastAPI declares dependencies as parameter defaults (Depends/Query); that is the documented pattern.
"api/*.py" = ["B008"]
