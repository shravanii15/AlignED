<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="AlignED: does a graduate program teach what employers ask for?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16213A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>

  <text x="64" y="104" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">AlignED</text>
  <text x="64" y="156" font-size="26" fill="#C7D2FE">Does your program teach</text>
  <text x="64" y="190" font-size="26" fill="#C7D2FE">what employers ask for?</text>

  <g font-size="15" font-weight="600">
    <rect x="64" y="236" width="170" height="40" rx="20" fill="#315CF5"/>
    <text x="149" y="262" text-anchor="middle" fill="#FFFFFF">13 programs</text>
    <rect x="246" y="236" width="170" height="40" rx="20" fill="#315CF5"/>
    <text x="331" y="262" text-anchor="middle" fill="#FFFFFF">1,378 courses</text>
    <rect x="64" y="288" width="200" height="40" rx="20" fill="#315CF5"/>
    <text x="164" y="314" text-anchor="middle" fill="#FFFFFF">1,660 job postings</text>
    <rect x="276" y="288" width="140" height="40" rx="20" fill="#1F9D68"/>
    <text x="346" y="314" text-anchor="middle" fill="#FFFFFF">170 gaps</text>
  </g>
  <text x="64" y="378" font-size="14" fill="#94A3B8">Match a job, find skill gaps, get a learning plan. Live demo: aligned-shravanikulkarni.streamlit.app</text>

  <!-- Example card -->
  <rect x="700" y="48" width="516" height="324" rx="16" fill="#FFFFFF"/>
  <text x="732" y="92" font-size="12" font-weight="700" fill="#667085" letter-spacing="1.5">WHAT AN ANSWER LOOKS LIKE</text>
  <text x="732" y="140" font-size="34" font-weight="800" fill="#101828">Python</text>

  <text x="732" y="192" font-size="14" fill="#667085">Courses</text>
  <rect x="842" y="176" width="280" height="18" rx="9" fill="#F1F3F6"/>
  <rect x="842" y="176" width="6" height="18" rx="3" fill="#1F9D68"/>
  <text x="1140" y="191" font-size="15" font-weight="700" fill="#101828">0%</text>

  <text x="732" y="240" font-size="14" fill="#667085">Job postings</text>
  <rect x="842" y="224" width="280" height="18" rx="9" fill="#F1F3F6"/>
  <rect x="842" y="224" width="280" height="18" rx="9" fill="#4C7DFF"/>
  <text x="1140" y="239" font-size="15" font-weight="700" fill="#101828">40%</text>

  <rect x="732" y="270" width="226" height="40" rx="20" fill="#FBEAEA"/>
  <text x="845" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#D94A4A">40-point gap</text>
  <text x="976" y="296" font-size="14" fill="#667085">evidence: very strong</text>
  <text x="732" y="344" font-size="12" fill="#98A2B3">Georgia Tech, MS CS (main catalog). Course text is short, so check the syllabus.</text>
</svg>
